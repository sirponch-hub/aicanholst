# Codex-специфичные метаданные. Остальные среды этот файл игнорируют:
# формат скилла общий (agentskills.io), а здесь только внешний вид карточки
# в приложении Codex и политика вызова.
#
# https://developers.openai.com/codex/skills

interface:
  display_name: "AI can Holst"
  short_description: "Собирает доску Холста (.holst) из вашего замысла"
  brand_color: "#FFF9B1"
  default_prompt: >
    Собери доску Холста: уточни, какие нужны кадры и что внутри,
    свёрстай по правилам из references/layout.md, проверь валидатором
    и отдай .holst файл.

policy:
  # Скилл только пишет файл в рабочую папку — ничего не удаляет, никуда не
  # ходит по сети. Неявный вызов безопасен и удобен: «собери доску» должно
  # срабатывать без явного $holst-board.
  allow_implicit_invocation: true
